<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Détail patient — MédiLabo Solutions</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
    <p><a th:href="@{/patients}">&larr; Retour à la liste</a></p>
    <h1 th:text="${patient.prenom} + ' ' + ${patient.nom}"></h1>
    <table>
        <tr>
            <th>Date de naissance</th>
            <td th:text="${patient.dateNaissance}"></td>
        </tr>
        <tr>
            <th>Genre</th>
            <td th:text="${patient.genre}"></td>
        </tr>
        <tr>
            <th>Adresse</th>
            <td th:text="${patient.adresse} ?: '—'"></td>
        </tr>
        <tr>
            <th>Téléphone</th>
            <td th:text="${patient.telephone} ?: '—'"></td>
        </tr>
    </table>
    <p><a class="button" th:href="@{/patients/{id}/edit(id=${patient.id})}">Modifier</a></p>

    <section>
        <h2>Niveau de risque</h2>
        <p th:if="${risk != null}" class="risk-level" th:text="${risk.riskLevel}"></p>
        <p th:if="${risk == null}" class="error" th:text="${riskError}"></p>
    </section>

    <section>
        <h2>Historique des notes</h2>
        <p th:if="${notes.isEmpty()}">Aucune note pour ce patient.</p>
        <div class="note" th:each="note : ${notes}">
            <p class="note-date" th:text="${note.dateCreation}"></p>
            <p class="note-contenu" th:text="${note.contenu}"></p>
        </div>
    </section>

    <section>
        <h2>Ajouter une note</h2>
        <form th:action="@{/patients/{id}/notes(id=${patient.id})}" th:object="${noteForm}" method="post">
            <div class="field">
                <label for="contenu">Observation</label>
                <textarea id="contenu" rows="6" th:field="*{contenu}"></textarea>
                <p class="error" th:if="${#fields.hasErrors('contenu')}" th:errors="*{contenu}"></p>
            </div>
            <button type="submit" class="button">Ajouter la note</button>
        </form>
    </section>
</main>
</body>
</html>
